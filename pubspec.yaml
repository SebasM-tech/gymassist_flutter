name: gymassist
description: GymAssist - gestión de gimnasios (Flutter, offline-first).
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  fl_chart: ^0.69.0
  intl: ">=0.19.0 <0.21.0"
  # --- capa de datos ---
  drift: ^2.20.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  bcrypt: ^1.1.3
  uuid: ^4.5.0
  # --- API de predicción (FastAPI + TensorFlow) ---
  http: ^1.2.2
  url_launcher: ^6.3.0     # abrir el checkout de Mercado Pago
  image_picker: ^1.1.2     # fotos de las rutinas (se suben a S3 vía Spring Boot)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  # TODO(offline): empaquetar la tipografía Inter en assets/fonts (no usar google_fonts: requiere red).
